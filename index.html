<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM/NS India - Confined Space Entry Portal</title>
    <style>
        :root {
            --primary-color: #c8102e;
            --secondary-color: #222222;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
        }

        .header h2 {
            color: var(--secondary-color);
            margin: 5px 0 0 0;
            font-size: 16px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--secondary-color);
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
            align-items: center;
            background: #f8f9fa;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .entrants-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .entrants-table th, .entrants-table td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: left;
        }

        .entrants-table th {
            background-color: #f1f1f1;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #a00c23;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            text-align: center;
            font-weight: bold;
        }

        .status-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>AM/NS INDIA</h1>
        <h2>Confined Space & Gas Hazard Area Entry Portal</h2>
    </div>

    <form id="confinedEntryForm">
        <!-- Area, Department & Work Permit No -->
        <div class="row">
            <div class="form-group">
                <label for="area">Area Category *</label>
                <select id="area" required onchange="generateCertNumbers()">
                    <option value="">Select Area</option>
                    <option value="NGHA">Confined Space (NGHA)</option>
                    <option value="GHA">Confined Space (GHA)</option>
                    <option value="GAS_HAZARD">Gas Hazard Area</option>
                </select>
            </div>
            <div class="form-group">
                <label for="department">Department *</label>
                <select id="department" required onchange="generateCertNumbers()">
                    <option value="">Select Department</option>
                    <option value="CGL_MECH">CGL Mech</option>
                    <option value="CGL_PROD">CGL Prod</option>
                    <option value="CGL_ELEC">CGL Elec</option>
                    <option value="CRM_MECH">CRM Mech</option>
                    <option value="CRM_PROD">CRM Prod</option>
                    <option value="CRM_ELEC">CRM Elec</option>
                    <option value="ARP">ARP</option>
                    <option value="PICKLING">Pickling</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="workPermitNo">Work Permit No. *</label>
                <input type="text" id="workPermitNo" required placeholder="Enter Work Permit Number">
            </div>
            <div class="form-group">
                <label for="confCertNo">Confined Space Certificate No. *</label>
                <select id="confCertNo" required>
                    <option value="">Select Area & Dept First</option>
                </select>
            </div>
        </div>

        <!-- Checkboxes for Associated Permits -->
        <div class="form-group">
            <label>Associated Hazards & Work Types *</label>
            <div class="checkbox-group">
                <div class="checkbox-item">
                    <label for="workAtHeight">Work at Height:</label>
                    <select id="workAtHeight" required style="width: auto;">
                        <option value="NO">NO</option>
                        <option value="YES">YES</option>
                    </select>
                </div>
                <div class="checkbox-item">
                    <label for="electricalWork">Electrical Work:</label>
                    <select id="electricalWork" required style="width: auto;">
                        <option value="NO">NO</option>
                        <option value="YES">YES</option>
                    </select>
                </div>
                <div class="checkbox-item">
                    <label for="weldingWork">Welding / Cutting Work:</label>
                    <select id="weldingWork" required style="width: auto;">
                        <option value="NO">NO</option>
                        <option value="YES">YES</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Work Description -->
        <div class="form-group">
            <label for="workDescription">Work Description *</label>
            <textarea id="workDescription" rows="3" required placeholder="Describe the job to be performed..."></textarea>
        </div>

        <!-- Entrants Dynamic Rows -->
        <div class="form-group">
            <label for="noOfEntrants">Number of Entrants *</label>
            <input type="number" id="noOfEntrants" min="1" max="60" required placeholder="Enter count of entrants" onchange="generateEntrantRows()">
        </div>

        <div class="form-group">
            <label>Name & ID of Entrants</label>
            <table class="entrants-table" id="entrantsTable">
                <thead>
                    <tr>
                        <th style="width: 10%;">#</th>
                        <th>Entrant Name & Employee/Contractor ID</th>
                    </tr>
                </thead>
                <tbody id="entrantsTableBody">
                    <tr>
                        <td>1</td>
                        <td><input type="text" class="entrant-input" required placeholder="e.g. John Doe (EMP12345)"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Personnel Details -->
        <div class="row">
            <div class="form-group">
                <label for="attendantName">Name & ID of Attendant *</label>
                <input type="text" id="attendantName" required placeholder="Attendant Name & ID">
            </div>
            <div class="form-group">
                <label for="supervisorName">Name of Supervisor *</label>
                <input type="text" id="supervisorName" required placeholder="Supervisor Name">
            </div>
        </div>

        <div class="form-group">
            <label for="rescuePersonName">Name of Rescue Person *</label>
            <input type="text" id="rescuePersonName" required placeholder="Rescue Person Name">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Enter in Confined Space</button>
    </form>

    <div id="statusMessage" class="status-message"></div>
</div>

<script>
    // Power Automate Webhook Endpoint URL
    const WEBHOOK_URL = "https://default37cd273a1cec4aaea29741480ea54f.8d.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/62e0ced429bc4b2aa03c672bf333334b/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hj17r1Zp5o87SzxxGK_CULg0KQFwE8MSEzOiGxYcvJo";

    // Dynamic Certificate Number Generator
    function generateCertNumbers() {
        const area = document.getElementById("area").value;
        const dept = document.getElementById("department").value;
        const certDropdown = document.getElementById("confCertNo");

        certDropdown.innerHTML = '<option value="">Select Certificate Number</option>';

        if (!area || !dept) return;

        let formattedDept = dept.replace("_", "/");

        for (let i = 1; i <= 60; i++) {
            let certNum = `AMNS/${formattedDept}/CNF/${i}/${area}`;
            let option = document.createElement("option");
            option.value = certNum;
            option.textContent = certNum;
            certDropdown.appendChild(option);
        }
    }

    // Dynamic Entrant Rows Generator
    function generateEntrantRows() {
        const count = parseInt(document.getElementById("noOfEntrants").value, 10) || 0;
        const tbody = document.getElementById("entrantsTableBody");
        tbody.innerHTML = "";

        if (count < 1) return;

        for (let i = 1; i <= count; i++) {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${i}</td>
                <td><input type="text" class="entrant-input" required placeholder="Entrant ${i} Name & ID"></td>
            `;
            tbody.appendChild(tr);
        }
    }

    // Form Submission & Webhook Triggering
    document.getElementById("confinedEntryForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const submitBtn = document.getElementById("submitBtn");
        const statusMsg = document.getElementById("statusMessage");

        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting Entry Data...";
        statusMsg.style.display = "none";

        // Collect all entrant details into an array
        const entrantInputs = document.querySelectorAll(".entrant-input");
        const entrantsList = [];
        entrantInputs.forEach((input, index) => {
            if (input.value.trim() !== "") {
                entrantsList.push(`${index + 1}. ${input.value.trim()}`);
            }
        });

        // Construct JSON Payload
        const payload = {
            WorkPermitNo: document.getElementById("workPermitNo").value,
            ConfinedSpaceCertNo: document.getElementById("confCertNo").value,
            WorkAtHeight: document.getElementById("workAtHeight").value,
            ElectricalWork: document.getElementById("electricalWork").value,
            WeldingCuttingWork: document.getElementById("weldingWork").value,
            AreaCategory: document.getElementById("area").value,
            Department: document.getElementById("department").value,
            WorkDescription: document.getElementById("workDescription").value,
            NoOfEntrants: entrantsList.length,
            EntrantsList: entrantsList.join("\n"),
            AttendantName: document.getElementById("attendantName").value,
            SupervisorName: document.getElementById("supervisorName").value,
            RescuePersonName: document.getElementById("rescuePersonName").value,
            Timestamp: new Date().toLocaleString()
        };

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.ok || response.status === 202) {
                statusMsg.className = "status-message success";
                statusMsg.innerText = "Entry registered successfully! Email sent to Department HOD & Chairman.";
                document.getElementById("confinedEntryForm").reset();
                document.getElementById("entrantsTableBody").innerHTML = `
                    <tr>
                        <td>1</td>
                        <td><input type="text" class="entrant-input" required placeholder="e.g. John Doe (EMP12345)"></td>
                    </tr>`;
            } else {
                const errText = await response.text();
                console.error("HTTP Response Error:", response.status, errText);
                statusMsg.className = "status-message error";
                statusMsg.innerText = `Submission failed (${response.status}). Check browser console.`;
            }
        } catch (err) {
            console.error("Network Error:", err);
            statusMsg.className = "status-message error";
            statusMsg.innerText = "Network Error! Could not reach Power Automate endpoint.";
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Enter in Confined Space";
            statusMsg.style.display = "block";
        }
    });
</script>

</body>
</html>
