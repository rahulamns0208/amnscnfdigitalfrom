<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM/NS India - Confined Space & GHA FPS Registration</title>
    <style>
        :root {
            --primary-color: #c8102e;
            --secondary-color: #222222;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
        }

        .header h2 {
            color: var(--secondary-color);
            margin: 5px 0 0 0;
            font-size: 16px;
            font-weight: 500;
        }

        .tab-navigation {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            background: #e9ecef;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--secondary-color);
        }

        input[type="text"],
        input[type="number"],
        input[type="datetime-local"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #a00c23;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            text-align: center;
            font-weight: bold;
        }

        .status-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>AM/NS INDIA</h1>
        <h2>Confined Space & GHA FPS Permit Management</h2>
    </div>

    <!-- Mode Selector Tabs -->
    <div class="tab-navigation">
        <button class="tab-btn active" id="entryTabBtn" onclick="switchTab('entry')">1. Entry Registration</button>
        <button class="tab-btn" id="exitTabBtn" onclick="switchTab('exit')">2. Exit & Closure Sign-off</button>
    </div>

    <!-- FORM 1: ENTRY DATA -->
    <div id="entrySection" class="form-section active">
        <form id="entryForm">
            <div class="row">
                <div class="form-group">
                    <label for="entryPermitNo">Master Permit No. *</label>
                    <input type="text" id="entryPermitNo" required placeholder="e.g., PER-2026-001">
                </div>
                <div class="form-group">
                    <label for="entryDepartment">Department *</label>
                    <select id="entryDepartment" required>
                        <option value="">Select Department</option>
                        <option value="CRM-Production">CRM - Production</option>
                        <option value="CRM-Mechanical">CRM - Mechanical</option>
                        <option value="CRM-Electrical">CRM - Electrical</option>
                        <option value="ARP">ARP</option>
                        <option value="Pickling">Pickling</option>
                        <option value="CGL">CGL</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="entryLocation">Exact Location / Equipment *</label>
                    <input type="text" id="entryLocation" required placeholder="e.g., Acid Pit / Tank Basement">
                </div>
                <div class="form-group">
                    <label for="entrySupervisor">Supervisor / Issuer Name *</label>
                    <input type="text" id="entrySupervisor" required placeholder="Supervisor Name">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="entryAttendant">Standby Attendant Name *</label>
                    <input type="text" id="entryAttendant" required placeholder="Attendant Name">
                </div>
                <div class="form-group">
                    <label for="entryTotalCount">Total Entrants Count *</label>
                    <input type="number" id="entryTotalCount" min="1" required placeholder="e.g., 4">
                </div>
            </div>

            <div class="form-group">
                <label for="entryTime">Entry Timestamp *</label>
                <input type="datetime-local" id="entryTime" required>
            </div>

            <div class="form-group">
                <label for="entrantsList">Names / IDs of Personnel Entering</label>
                <textarea id="entrantsList" rows="3" placeholder="Enter personnel details separated by commas..."></textarea>
            </div>

            <button type="submit" class="btn-submit" id="entrySubmitBtn">Submit Entry & Send Entry Mail</button>
        </form>
    </div>

    <!-- FORM 2: EXIT DATA -->
    <div id="exitSection" class="form-section">
        <form id="exitForm">
            <div class="row">
                <div class="form-group">
                    <label for="exitPermitNo">Master Permit No. *</label>
                    <input type="text" id="exitPermitNo" required placeholder="e.g., PER-2026-001">
                </div>
                <div class="form-group">
                    <label for="exitDepartment">Department *</label>
                    <select id="exitDepartment" required>
                        <option value="">Select Department</option>
                        <option value="CRM-Production">CRM - Production</option>
                        <option value="CRM-Mechanical">CRM - Mechanical</option>
                        <option value="CRM-Electrical">CRM - Electrical</option>
                        <option value="ARP">ARP</option>
                        <option value="Pickling">Pickling</option>
                        <option value="CGL">CGL</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="exitSupervisor">Closure Supervisor Name *</label>
                    <input type="text" id="exitSupervisor" required placeholder="Supervisor Name">
                </div>
                <div class="form-group">
                    <label for="exitTime">Exit Timestamp *</label>
                    <input type="datetime-local" id="exitTime" required>
                </div>
            </div>

            <div class="form-group">
                <label for="allEntrantsOut">Confirmation *</label>
                <select id="allEntrantsOut" required>
                    <option value="YES">Yes - All entrants are physically verified OUT</option>
                    <option value="NO">No - Person missing (Do not close)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="exitRemarks">Work Completion Remarks</label>
                <textarea id="exitRemarks" rows="3" placeholder="Enter work summary and safe housekeeping remarks..."></textarea>
            </div>

            <button type="submit" class="btn-submit" id="exitSubmitBtn">Submit Exit & Send Close Mail</button>
        </form>
    </div>

    <div id="statusMessage" class="status-message"></div>
</div>

<script>
    // Webhook Configuration URLs
    // Place your Power Automate HTTP trigger URLs here
    const ENTRY_WEBHOOK_URL = "https://default37cd273a1cec4aaea29741480ea54f.8d.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/62e0ced429bc4b2aa03c672bf333334b/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hj17r1Zp5o87SzxxGK_CULg0KQFwE8MSEzOiGxYcvJo";
    const EXIT_WEBHOOK_URL = "https://default37cd273a1cec4aaea29741480ea54f.8d.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/62e0ced429bc4b2aa03c672bf333334b/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hj17r1Zp5o87SzxxGK_CULg0KQFwE8MSEzOiGxYcvJo";

    // Set initial timestamps
    document.addEventListener("DOMContentLoaded", () => {
        resetTimestamps();
    });

    function resetTimestamps() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        const formatted = now.toISOString().slice(0, 16);
        document.getElementById("entryTime").value = formatted;
        document.getElementById("exitTime").value = formatted;
    }

    // Switch between Entry and Exit Tabs
    function switchTab(type) {
        const entryTab = document.getElementById("entryTabBtn");
        const exitTab = document.getElementById("exitTabBtn");
        const entrySec = document.getElementById("entrySection");
        const exitSec = document.getElementById("exitSection");
        const statusMsg = document.getElementById("statusMessage");

        statusMsg.style.display = "none";

        if (type === 'entry') {
            entryTab.classList.add("active");
            exitTab.classList.remove("active");
            entrySec.classList.add("active");
            exitSec.classList.remove("active");
        } else {
            exitTab.classList.add("active");
            entryTab.classList.remove("active");
            exitSec.classList.add("active");
            entrySec.classList.remove("active");
        }
    }

    // 1. SUBMIT ENTRY DATA
    document.getElementById("entryForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        
        const payload = {
            RecordType: "ENTRY_DATA",
            PermitNo: document.getElementById("entryPermitNo").value,
            Department: document.getElementById("entryDepartment").value,
            Location: document.getElementById("entryLocation").value,
            Supervisor: document.getElementById("entrySupervisor").value,
            Attendant: document.getElementById("entryAttendant").value,
            TotalEntrants: parseInt(document.getElementById("entryTotalCount").value, 10),
            Timestamp: document.getElementById("entryTime").value,
            EntrantsList: document.getElementById("entrantsList").value
        };

        await sendDataToWebhook(ENTRY_WEBHOOK_URL, payload, "entrySubmitBtn", "Entry notification flow triggered successfully!");
    });

    // 2. SUBMIT EXIT / CLOSURE DATA
    document.getElementById("exitForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const payload = {
            RecordType: "EXIT_DATA",
            PermitNo: document.getElementById("exitPermitNo").value,
            Department: document.getElementById("exitDepartment").value,
            Supervisor: document.getElementById("exitSupervisor").value,
            Timestamp: document.getElementById("exitTime").value,
            AllEntrantsOut: document.getElementById("allEntrantsOut").value,
            Remarks: document.getElementById("exitRemarks").value
        };

        await sendDataToWebhook(EXIT_WEBHOOK_URL, payload, "exitSubmitBtn", "Permit closure notification flow triggered successfully!");
    });

    // Shared Post Execution Function
    async function sendDataToWebhook(url, payload, btnId, successText) {
        const btn = document.getElementById(btnId);
        const statusMsg = document.getElementById("statusMessage");

        btn.disabled = true;
        btn.innerText = "Sending Data...";
        statusMsg.style.display = "none";

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.ok || response.status === 202) {
                statusMsg.className = "status-message success";
                statusMsg.innerText = successText;
                
                if (payload.RecordType === "ENTRY_DATA") {
                    document.getElementById("entryForm").reset();
                } else {
                    document.getElementById("exitForm").reset();
                }
                resetTimestamps();
            } else {
                const errText = await response.text();
                console.error("Response Error:", response.status, errText);
                statusMsg.className = "status-message error";
                statusMsg.innerText = `Error (${response.status}): Could not complete trigger. Check browser console.`;
            }
        } catch (err) {
            console.error("Network Error:", err);
            statusMsg.className = "status-message error";
            statusMsg.innerText = "Network Error! Could not reach Power Automate endpoint.";
        } finally {
            btn.disabled = false;
            btn.innerText = payload.RecordType === "ENTRY_DATA" ? "Submit Entry & Send Entry Mail" : "Submit Exit & Send Close Mail";
            statusMsg.style.display = "block";
        }
    }
</script>

</body>
</html>
