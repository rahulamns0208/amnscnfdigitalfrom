<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM/NS India - Confined Space & GHA FPS Registration Portal</title>
    <style>
        :root {
            --primary-color: #c8102e;
            --secondary-color: #222222;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
        }

        .header h2 {
            color: var(--secondary-color);
            margin: 5px 0 0 0;
            font-size: 16px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--secondary-color);
        }

        input[type="text"],
        input[type="number"],
        input[type="datetime-local"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #a00c23;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            text-align: center;
            font-weight: bold;
        }

        .status-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>AM/NS INDIA</h1>
        <h2>Confined Space & Gas Hazard Area (GHA) Entry Registration</h2>
    </div>

    <form id="digitalEntryForm">
        <div class="row">
            <div class="form-group">
                <label for="permitNo">Master Permit No. *</label>
                <input type="text" id="permitNo" name="permitNo" required placeholder="e.g., PER-2026-001">
            </div>
            <div class="form-group">
                <label for="department">Department *</label>
                <select id="department" name="department" required>
                    <option value="">Select Department</option>
                    <option value="CRM-Production">CRM - Production</option>
                    <option value="CRM-Mechanical">CRM - Mechanical</option>
                    <option value="CRM-Electrical">CRM - Electrical</option>
                    <option value="ARP">ARP</option>
                    <option value="Pickling">Pickling</option>
                    <option value="CGL">CGL</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="location">Exact Work Location / Equipment *</label>
                <input type="text" id="location" name="location" required placeholder="e.g., Tank / Cell / Basement Area">
            </div>
            <div class="form-group">
                <label for="status">Work Stage *</label>
                <select id="status" name="status" required>
                    <option value="ENTRY_REGISTRATION">Step 1: Entry Registration</option>
                    <option value="WORK_COMPLETION">Step 2: Exit & Work Completion Sign-off</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="supervisor">Permit Issuer / Supervisor Name *</label>
                <input type="text" id="supervisor" name="supervisor" required placeholder="Supervisor Name">
            </div>
            <div class="form-group">
                <label for="attendant">Standby Attendant Name *</label>
                <input type="text" id="attendant" name="attendant" required placeholder="Attendant Name">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="totalEntrants">Number of Authorized Entrants *</label>
                <input type="number" id="totalEntrants" name="totalEntrants" min="1" required placeholder="e.g., 3">
            </div>
            <div class="form-group">
                <label for="entryTime">Timestamp *</label>
                <input type="datetime-local" id="entryTime" name="entryTime" required>
            </div>
        </div>

        <div class="form-group">
            <label for="entrantsList">Names / Employee IDs of Personnel Entering</label>
            <textarea id="entrantsList" name="entrantsList" rows="3" placeholder="Enter personnel details separated by commas..."></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Submit Registration & Trigger Notification</button>
    </form>

    <div id="statusMessage" class="status-message"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById("entryTime").value = now.toISOString().slice(0, 16);
    });

    document.getElementById("digitalEntryForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const submitBtn = document.getElementById("submitBtn");
        const statusMsg = document.getElementById("statusMessage");

        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting to Webhook...";
        statusMsg.style.display = "none";

        const webhookUrl = "https://default37cd273a1cec4aaea29741480ea54f.8d.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/62e0ced429bc4b2aa03c672bf333334b/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hj17r1Zp5o87SzxxGK_CULg0KQFwE8MSEzOiGxYcvJo";

        const formData = {
            PermitNo: document.getElementById("permitNo").value,
            Department: document.getElementById("department").value,
            Location: document.getElementById("location").value,
            Status: document.getElementById("status").value,
            Supervisor: document.getElementById("supervisor").value,
            Attendant: document.getElementById("attendant").value,
            TotalEntrants: parseInt(document.getElementById("totalEntrants").value, 10),
            Timestamp: document.getElementById("entryTime").value,
            EntrantsList: document.getElementById("entrantsList").value
        };

        try {
            const response = await fetch(webhookUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(formData)
            });

            if (response.ok || response.status === 202) {
                statusMsg.className = "status-message success";
                statusMsg.innerText = "Registration successful! Power Automate flow triggered.";
                document.getElementById("digitalEntryForm").reset();
                
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById("entryTime").value = now.toISOString().slice(0, 16);
            } else {
                const errorDetails = await response.text();
                console.error("HTTP Error Status:", response.status, errorDetails);
                statusMsg.className = "status-message error";
                statusMsg.innerText = `Submission failed (Status Code: ${response.status}). Check browser console.`;
            }
        } catch (error) {
            console.error("Network / CORS Error:", error);
            statusMsg.className = "status-message error";
            statusMsg.innerText = "Network Error! Could not reach Power Automate endpoint. Check console.";
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Registration & Trigger Notification";
            statusMsg.style.display = "block";
        }
    });
</script>

</body>
</html>
